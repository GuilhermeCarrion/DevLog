services:
  postgres:
    image: postgres:16-alpine
    container_name: devlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devlog
      POSTGRES_PASSWORD: devlog
      POSTGRES_DB: devlog
    ports:
      - "5432:5432"
    volumes:
      - devlog_pgdata:/var/lib/postgresql/data

volumes:
  devlog_pgdata:
